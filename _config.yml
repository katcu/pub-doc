   title: 你的网站标题
   description: 你的网站描述
   remote_theme: just-the-docs/just-the-docs
   
   # 可选的主题设置
   color_scheme: light  # 或 light
   search_enabled: true
   search:
     # 分词方式：可以按字符分割
     tokenizer_separator: /[\s\-/]+/
     # 支持中文
     language: 'zh'
     # 添加中文分词
     additional_stopwords: ['的', '了', '和', '与', '或']
   
   # 确保正确的字符编码
   encoding: utf-8
